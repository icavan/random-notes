.flow{display:grid;grid-template-columns:1fr 54px 2fr 54px 1fr 54px 1fr;align-items:stretch;margin-top:17px} .flowbox{border:1px solid var(--line);border-radius:8px;padding:14px 15px;background:var(--soft);min-height:94px} .flowbox.main{background:#f7fbff;border-color:#b9d5ee} .arrow{display:flex;align-items:center;justify-content:center;color:#75808d;font-size:25px;font-weight:250}
