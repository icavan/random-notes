<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">How CTA dispatch amortization speeds up small-D Fast Hadamard Transforms</title>
  <desc id="desc">A clean white diagram explaining that row packing keeps one host kernel launch but reduces GPU CTA dispatches, followed by measured H200 and B200 speedups across row counts and transform dimensions.</desc>
  <metadata><![CDATA[
  {"id":"fht-cta-launch-overhead-speedup","scope":"BF16 power-of-two FHT row packing measurements","source_refs":["FAST_HADAMARD_TRANSFORM_GPU_OPTIMIZATION.md:179","FAST_HADAMARD_TRANSFORM_GPU_OPTIMIZATION.md:208","FAST_HADAMARD_TRANSFORM_GPU_OPTIMIZATION.md:277","FAST_HADAMARD_TRANSFORM_GPU_OPTIMIZATION.md:318","FAST_HADAMARD_TRANSFORM_GPU_OPTIMIZATION.md:413"],"assertions":["host kernel launch count is unchanged","D=128 packs 8 rows per CTA","CTA count falls from N_rows to ceil(N_rows/8)","D=128 BF16 plateau is 4.94x on H200 and 5.70x on B200","at 524288 rows speedup falls as D and useful work per row increase"]}
  ]]></metadata>
  <defs>
    <style>
      text { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-weight: 400; fill: #1e293b; }
      .title { font-size: 39px; fill: #0f172a; }
      .subtitle { font-size: 19px; fill: #64748b; }
      .section { font-size: 22px; fill: #0f172a; }
      .label { font-size: 16px; }
      .small { font-size: 13px; fill: #64748b; }
      .tiny { font-size: 11px; fill: #64748b; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; font-size: 14px; }
      .axis { stroke: #94a3b8; stroke-width: 1.2; }
      .grid { stroke: #e2e8f0; stroke-width: 1; }
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#ffffff"/>
  <text x="75" y="65" class="title">How CTA dispatch overhead limits small-D FHT</text>
  <text x="75" y="100" class="subtitle">Pack independent rows into fuller CTAs: the arithmetic and memory traffic stay the same, but the GPU schedules fewer blocks.</text>

  <!-- Causal explanation -->
  <rect x="75" y="135" width="930" height="276" rx="20" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="105" y="174" class="section">1 · Same host launch, fewer GPU CTA dispatches</text>

  <rect x="105" y="208" width="130" height="74" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="170" y="237" text-anchor="middle" class="label" fill="#1d4ed8">Host</text>
  <text x="170" y="262" text-anchor="middle" class="small">one kernel launch</text>
  <path d="M235 245 H280" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="302" y="217" class="small">Original · one D=128 row per CTA</text>
  <g>
    <rect x="302" y="232" width="65" height="62" rx="8" fill="#fff7ed" stroke="#fb923c"/>
    <rect x="375" y="232" width="65" height="62" rx="8" fill="#fff7ed" stroke="#fb923c"/>
    <rect x="448" y="232" width="65" height="62" rx="8" fill="#fff7ed" stroke="#fb923c"/>
    <rect x="521" y="232" width="65" height="62" rx="8" fill="#fff7ed" stroke="#fb923c"/>
    <rect x="594" y="232" width="65" height="62" rx="8" fill="#fff7ed" stroke="#fb923c"/>
    <rect x="667" y="232" width="65" height="62" rx="8" fill="#fff7ed" stroke="#fb923c"/>
    <rect x="740" y="232" width="65" height="62" rx="8" fill="#fff7ed" stroke="#fb923c"/>
    <rect x="813" y="232" width="65" height="62" rx="8" fill="#fff7ed" stroke="#fb923c"/>
    <g class="tiny" text-anchor="middle">
      <text x="334" y="253">dispatch</text><text x="407" y="253">dispatch</text><text x="480" y="253">dispatch</text><text x="553" y="253">dispatch</text>
      <text x="626" y="253">dispatch</text><text x="699" y="253">dispatch</text><text x="772" y="253">dispatch</text><text x="845" y="253">dispatch</text>
      <text x="334" y="279">row</text><text x="407" y="279">row</text><text x="480" y="279">row</text><text x="553" y="279">row</text>
      <text x="626" y="279">row</text><text x="699" y="279">row</text><text x="772" y="279">row</text><text x="845" y="279">row</text>
    </g>
    <g stroke="#fdba74"><line x1="302" y1="260" x2="367" y2="260"/><line x1="375" y1="260" x2="440" y2="260"/><line x1="448" y1="260" x2="513" y2="260"/><line x1="521" y1="260" x2="586" y2="260"/><line x1="594" y1="260" x2="659" y2="260"/><line x1="667" y1="260" x2="732" y2="260"/><line x1="740" y1="260" x2="805" y2="260"/><line x1="813" y1="260" x2="878" y2="260"/></g>
  </g>
  <text x="900" y="268" class="label" fill="#c2410c">8 CTAs</text>

  <path d="M170 282 V339 H280" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="302" y="322" class="small">Packed · eight independent rows share one 128-thread CTA</text>
  <rect x="302" y="338" width="576" height="52" rx="10" fill="#f0fdfa" stroke="#2dd4bf"/>
  <rect x="302" y="338" width="88" height="52" rx="10" fill="#ccfbf1" stroke="#2dd4bf"/>
  <text x="346" y="359" text-anchor="middle" class="tiny" fill="#0f766e">dispatch</text>
  <text x="346" y="378" text-anchor="middle" class="tiny" fill="#0f766e">paid once</text>
  <g class="tiny" text-anchor="middle" fill="#0f766e">
    <text x="420" y="369">row 0</text><text x="482" y="369">row 1</text><text x="544" y="369">row 2</text><text x="606" y="369">row 3</text>
    <text x="668" y="369">row 4</text><text x="730" y="369">row 5</text><text x="792" y="369">row 6</text><text x="850" y="369">row 7</text>
  </g>
  <g stroke="#99f6e4"><line x1="451" y1="346" x2="451" y2="382"/><line x1="513" y1="346" x2="513" y2="382"/><line x1="575" y1="346" x2="575" y2="382"/><line x1="637" y1="346" x2="637" y2="382"/><line x1="699" y1="346" x2="699" y2="382"/><line x1="761" y1="346" x2="761" y2="382"/><line x1="823" y1="346" x2="823" y2="382"/></g>
  <text x="900" y="370" class="label" fill="#0f766e">1 CTA</text>

  <!-- Model panel -->
  <rect x="1035" y="135" width="490" height="276" rx="20" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="1065" y="174" class="section" fill="#1d4ed8">2 · What packing removes</text>
  <text x="1065" y="217" class="mono">T_original ≈ T_launch</text>
  <text x="1192" y="245" class="mono">+ N_rows · t_CTA</text>
  <text x="1192" y="273" class="mono">+ T_useful</text>
  <line x1="1065" y1="292" x2="1495" y2="292" stroke="#bfdbfe"/>
  <text x="1065" y="327" class="mono">T_packed ≈ T_launch</text>
  <text x="1192" y="355" class="mono">+ ceil(N_rows / r) · t_CTA</text>
  <text x="1192" y="383" class="mono">+ T_useful + T_pack</text>
  <text x="1065" y="402" class="tiny">t_CTA is an order-100-ns model, not a universal hardware constant.</text>

  <!-- Measured speedup vs rows -->
  <rect x="75" y="445" width="850" height="375" rx="20" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="105" y="484" class="section">3 · Measured sweet spot · D=128 BF16</text>
  <text x="105" y="509" class="small">CUDA-event speedup, packed / original · eight rows per CTA</text>

  <!-- chart grid y=1..6, plot x=155,255,355,455,555,655,755; chart y 760 to 550 -->
  <g class="grid">
    <line x1="145" y1="755" x2="875" y2="755"/><line x1="145" y1="715" x2="875" y2="715"/><line x1="145" y1="675" x2="875" y2="675"/>
    <line x1="145" y1="635" x2="875" y2="635"/><line x1="145" y1="595" x2="875" y2="595"/><line x1="145" y1="555" x2="875" y2="555"/>
  </g>
  <line x1="145" y1="755" x2="875" y2="755" class="axis"/>
  <line x1="145" y1="535" x2="145" y2="755" class="axis"/>
  <g class="tiny" text-anchor="end">
    <text x="135" y="759">1×</text><text x="135" y="719">2×</text><text x="135" y="679">3×</text><text x="135" y="639">4×</text><text x="135" y="599">5×</text><text x="135" y="559">6×</text>
  </g>
  <g class="tiny" text-anchor="middle">
    <text x="170" y="780">1K</text><text x="280" y="780">16K</text><text x="390" y="780">32K</text><text x="500" y="780">65K</text>
    <text x="610" y="780">131K</text><text x="720" y="780">524K</text><text x="845" y="780">2.1M rows</text>
  </g>

  <!-- H200: y = 795 - speed*40 -->
  <polyline points="170,756 280,746 390,707 500,624 610,627 720,603 845,597" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <g fill="#2563eb" stroke="#ffffff" stroke-width="2">
    <circle cx="170" cy="756" r="5"/><circle cx="280" cy="746" r="5"/><circle cx="390" cy="707" r="5"/><circle cx="500" cy="624" r="5"/><circle cx="610" cy="627" r="5"/><circle cx="720" cy="603" r="5"/><circle cx="845" cy="597" r="5"/>
  </g>
  <!-- B200 -->
  <polyline points="170,755 280,750 390,751 500,744 610,692 720,579 845,567" fill="none" stroke="#0f766e" stroke-width="2.5"/>
  <g fill="#0f766e" stroke="#ffffff" stroke-width="2">
    <circle cx="170" cy="755" r="5"/><circle cx="280" cy="750" r="5"/><circle cx="390" cy="751" r="5"/><circle cx="500" cy="744" r="5"/><circle cx="610" cy="692" r="5"/><circle cx="720" cy="579" r="5"/><circle cx="845" cy="567" r="5"/>
  </g>
  <line x1="655" y1="540" x2="680" y2="540" stroke="#2563eb" stroke-width="2.5"/><text x="690" y="545" class="small" fill="#1d4ed8">H200 · plateau 4.94×</text>
  <line x1="655" y1="561" x2="680" y2="561" stroke="#0f766e" stroke-width="2.5"/><text x="690" y="566" class="small" fill="#0f766e">B200 · plateau 5.70×</text>
  <rect x="155" y="525" width="220" height="42" rx="9" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="265" y="543" text-anchor="middle" class="tiny" fill="#9a3412">small workloads sit on the fixed call floor</text>
  <text x="265" y="559" text-anchor="middle" class="tiny" fill="#9a3412">packing can be tied or slightly slower</text>

  <!-- Dimension sweep -->
  <rect x="955" y="445" width="570" height="375" rx="20" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="985" y="484" class="section">4 · Final speedup by D</text>
  <text x="985" y="509" class="small">524,288 BF16 rows · CUDA-event timing</text>
  <g class="grid">
    <line x1="1025" y1="755" x2="1485" y2="755"/><line x1="1025" y1="715" x2="1485" y2="715"/><line x1="1025" y1="675" x2="1485" y2="675"/>
    <line x1="1025" y1="635" x2="1485" y2="635"/><line x1="1025" y1="595" x2="1485" y2="595"/><line x1="1025" y1="555" x2="1485" y2="555"/>
  </g>
  <line x1="1025" y1="755" x2="1485" y2="755" class="axis"/><line x1="1025" y1="535" x2="1025" y2="755" class="axis"/>
  <g class="tiny" text-anchor="end"><text x="1015" y="759">0×</text><text x="1015" y="719">2×</text><text x="1015" y="679">4×</text><text x="1015" y="639">6×</text><text x="1015" y="599">8×</text><text x="1015" y="559">10×</text></g>

  <!-- grouped bars: scale 20 px per speedup -->
  <g>
    <rect x="1060" y="573" width="38" height="182" rx="5" fill="#dbeafe" stroke="#2563eb"/><rect x="1102" y="577" width="38" height="178" rx="5" fill="#ccfbf1" stroke="#0f766e"/>
    <rect x="1170" y="659" width="38" height="96" rx="5" fill="#dbeafe" stroke="#2563eb"/><rect x="1212" y="647" width="38" height="108" rx="5" fill="#ccfbf1" stroke="#0f766e"/>
    <rect x="1280" y="709" width="38" height="46" rx="5" fill="#dbeafe" stroke="#2563eb"/><rect x="1322" y="703" width="38" height="52" rx="5" fill="#ccfbf1" stroke="#0f766e"/>
    <rect x="1390" y="730" width="38" height="25" rx="5" fill="#dbeafe" stroke="#2563eb"/><rect x="1432" y="725" width="38" height="30" rx="5" fill="#ccfbf1" stroke="#0f766e"/>
  </g>
  <g class="tiny" text-anchor="middle">
    <text x="1079" y="565" fill="#1d4ed8">9.08×</text><text x="1121" y="569" fill="#0f766e">8.90×</text>
    <text x="1189" y="651" fill="#1d4ed8">4.79×</text><text x="1231" y="639" fill="#0f766e">5.41×</text>
    <text x="1299" y="701" fill="#1d4ed8">2.31×</text><text x="1341" y="695" fill="#0f766e">2.60×</text>
    <text x="1409" y="722" fill="#1d4ed8">1.26×</text><text x="1451" y="717" fill="#0f766e">1.49×</text>
    <text x="1100" y="780">D=64 · 16 rows/CTA</text><text x="1210" y="780">D=128 · 8</text><text x="1320" y="780">D=256 · 4</text><text x="1430" y="780">D=512 · 4</text>
  </g>
  <rect x="1065" y="528" width="12" height="12" fill="#dbeafe" stroke="#2563eb"/><text x="1085" y="539" class="tiny">H200</text>
  <rect x="1135" y="528" width="12" height="12" fill="#ccfbf1" stroke="#0f766e"/><text x="1155" y="539" class="tiny">B200</text>
  <text x="1255" y="808" text-anchor="middle" class="small">More useful work per row naturally amortizes CTA overhead, so packing matters less as D grows.</text>

  <text x="75" y="855" class="small">Measured against the preserved Tri Dao CUDA implementation · all sampled correctness cases had max absolute difference 0</text>
  <text x="75" y="880" class="small">Source audit: FAST_HADAMARD_TRANSFORM_GPU_OPTIMIZATION.md §§4–6 · H200 and B200 software stacks differ; within-GPU original/packed comparisons are controlled.</text>
</svg>
