<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Amortizing CTA dispatch overhead with FHT row packing</title>
  <desc id="desc">A clean white diagram for D equals 128 BF16 showing one unchanged host kernel launch, eight GPU CTA dispatches reduced to one, the exact eight-row and four-warp packing, and measured H200 and B200 speedups.</desc>
  <metadata><![CDATA[
  {"id":"fht-cta-row-packing-clean","scope":"D=128 BF16 power-of-two FHT, 16 logical threads per row, 8 rows per 128-thread CTA","source_refs":["cutedsl/hadamard_transform.py:_compute_rows_per_block","FAST_HADAMARD_TRANSFORM_GPU_OPTIMIZATION.md:179-348","FAST_HADAMARD_TRANSFORM_GPU_OPTIMIZATION.md:413-425"],"assertions":["host kernel launch count remains one","eight rows require eight CTAs before packing and one CTA after packing","two 16-thread rows occupy each physical 32-lane warp","FHT arithmetic and compulsory memory traffic are unchanged","measured D=128 BF16 plateau is 4.94x H200 and 5.70x B200"]}
  ]]></metadata>
  <defs>
    <style>
      text { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-weight: 400; fill: #1e293b; }
      .title { font-size: 39px; fill: #0f172a; }
      .subtitle { font-size: 19px; fill: #64748b; }
      .section { font-size: 21px; fill: #0f172a; }
      .label { font-size: 16px; }
      .small { font-size: 13px; fill: #64748b; }
      .tiny { font-size: 11px; fill: #64748b; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; font-size: 13px; }
      .formula { font-family: "STIX Two Math", "Times New Roman", serif; font-size: 20px; }
    </style>
    <linearGradient id="active" x1="0" x2="1">
      <stop offset="0" stop-color="#93c5fd"/><stop offset="0.5" stop-color="#5eead4"/><stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#64748b"/>
    </marker>
    <symbol id="row16" viewBox="0 0 256 24">
      <rect x="0" y="0" width="256" height="24" rx="5" fill="url(#active)" stroke="#0f766e"/>
      <g stroke="#ffffff" stroke-opacity="0.8">
        <line x1="16" y1="1" x2="16" y2="23"/><line x1="32" y1="1" x2="32" y2="23"/><line x1="48" y1="1" x2="48" y2="23"/>
        <line x1="64" y1="1" x2="64" y2="23"/><line x1="80" y1="1" x2="80" y2="23"/><line x1="96" y1="1" x2="96" y2="23"/>
        <line x1="112" y1="1" x2="112" y2="23"/><line x1="128" y1="1" x2="128" y2="23"/><line x1="144" y1="1" x2="144" y2="23"/>
        <line x1="160" y1="1" x2="160" y2="23"/><line x1="176" y1="1" x2="176" y2="23"/><line x1="192" y1="1" x2="192" y2="23"/>
        <line x1="208" y1="1" x2="208" y2="23"/><line x1="224" y1="1" x2="224" y2="23"/><line x1="240" y1="1" x2="240" y2="23"/>
      </g>
    </symbol>
  </defs>

  <rect width="1600" height="900" fill="#ffffff"/>
  <text x="60" y="60" class="title">Amortizing CTA dispatch overhead</text>
  <text x="60" y="94" class="subtitle">Pack more independent rows into each block: launch one kernel, schedule fewer CTAs.</text>

  <!-- top distinction -->
  <rect x="60" y="120" width="720" height="54" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="88" y="153" class="label">Host kernel launches</text>
  <text x="410" y="153" class="formula">1 → 1</text>
  <text x="505" y="153" class="small" fill="#1d4ed8">unchanged</text>
  <rect x="800" y="120" width="740" height="54" rx="12" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="828" y="153" class="label">GPU CTA dispatches for eight rows</text>
  <text x="1240" y="153" class="formula">8 → 1</text>
  <text x="1338" y="153" class="small" fill="#0f766e">8× fewer blocks</text>

  <!-- before -->
  <rect x="60" y="195" width="620" height="405" rx="20" fill="#fff7ed" stroke="#fdba74"/>
  <text x="90" y="233" class="section" fill="#9a3412">Before · one row per CTA</text>
  <text x="90" y="260" class="small">D=128 BF16 · 16 logical threads per row</text>
  <rect x="90" y="285" width="110" height="252" rx="14" fill="#ffffff" stroke="#fdba74"/>
  <text x="145" y="315" text-anchor="middle" class="label">GPU</text>
  <text x="145" y="338" text-anchor="middle" class="label">scheduler</text>
  <g stroke="#c2410c" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M200 330 C220 330 220 302 240 302"/><path d="M200 350 C220 350 220 342 240 342"/>
    <path d="M200 370 C220 370 220 382 240 382"/><path d="M200 390 C220 390 220 422 240 422"/>
    <path d="M200 410 C220 410 220 462 240 462"/><path d="M200 430 C220 430 220 502 240 502"/>
    <path d="M200 450 C220 450 220 542 240 542"/><path d="M200 470 C220 470 220 582 240 582"/>
  </g>

  <g>
    <rect x="240" y="282" width="410" height="34" rx="7" fill="#ffffff" stroke="#fb923c"/>
    <rect x="240" y="322" width="410" height="34" rx="7" fill="#ffffff" stroke="#fb923c"/>
    <rect x="240" y="362" width="410" height="34" rx="7" fill="#ffffff" stroke="#fb923c"/>
    <rect x="240" y="402" width="410" height="34" rx="7" fill="#ffffff" stroke="#fb923c"/>
    <rect x="240" y="442" width="410" height="34" rx="7" fill="#ffffff" stroke="#fb923c"/>
    <rect x="240" y="482" width="410" height="34" rx="7" fill="#ffffff" stroke="#fb923c"/>
    <rect x="240" y="522" width="410" height="34" rx="7" fill="#ffffff" stroke="#fb923c"/>
    <rect x="240" y="562" width="410" height="34" rx="7" fill="#ffffff" stroke="#fb923c"/>
  </g>
  <g class="tiny">
    <text x="252" y="304">CTA 0</text><text x="252" y="344">CTA 1</text><text x="252" y="384">CTA 2</text><text x="252" y="424">CTA 3</text>
    <text x="252" y="464">CTA 4</text><text x="252" y="504">CTA 5</text><text x="252" y="544">CTA 6</text><text x="252" y="584">CTA 7</text>
  </g>
  <g fill="url(#active)" stroke="#60a5fa"><rect x="300" y="290" width="160" height="18" rx="4"/><rect x="300" y="330" width="160" height="18" rx="4"/><rect x="300" y="370" width="160" height="18" rx="4"/><rect x="300" y="410" width="160" height="18" rx="4"/><rect x="300" y="450" width="160" height="18" rx="4"/><rect x="300" y="490" width="160" height="18" rx="4"/><rect x="300" y="530" width="160" height="18" rx="4"/><rect x="300" y="570" width="160" height="18" rx="4"/></g>
  <g fill="#e2e8f0" stroke="#cbd5e1"><rect x="470" y="290" width="160" height="18" rx="4"/><rect x="470" y="330" width="160" height="18" rx="4"/><rect x="470" y="370" width="160" height="18" rx="4"/><rect x="470" y="410" width="160" height="18" rx="4"/><rect x="470" y="450" width="160" height="18" rx="4"/><rect x="470" y="490" width="160" height="18" rx="4"/><rect x="470" y="530" width="160" height="18" rx="4"/><rect x="470" y="570" width="160" height="18" rx="4"/></g>
  <text x="380" y="278" text-anchor="middle" class="tiny" fill="#1d4ed8">active lanes 0–15</text>
  <text x="550" y="278" text-anchor="middle" class="tiny">unused lanes 16–31</text>

  <!-- transformation arrow -->
  <path d="M705 350 H795 V315 L875 397 L795 479 V444 H705 Z" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="790" y="382" text-anchor="middle" class="label" fill="#1d4ed8">row packing</text>
  <text x="790" y="408" text-anchor="middle" class="mono" fill="#1d4ed8">rows_per_block = 8</text>

  <!-- after -->
  <rect x="900" y="195" width="640" height="405" rx="20" fill="#f0fdfa" stroke="#5eead4"/>
  <text x="930" y="233" class="section" fill="#0f766e">After · eight rows per CTA</text>
  <text x="930" y="260" class="small">block.x = 16 × 8 = 128 threads · grid.x = rows / 8</text>
  <rect x="930" y="282" width="95" height="250" rx="14" fill="#ffffff" stroke="#5eead4"/>
  <text x="977" y="316" text-anchor="middle" class="label">GPU</text>
  <text x="977" y="339" text-anchor="middle" class="label">scheduler</text>
  <rect x="947" y="410" width="61" height="52" rx="9" fill="#ccfbf1" stroke="#2dd4bf"/>
  <text x="977" y="431" text-anchor="middle" class="tiny" fill="#0f766e">dispatch</text>
  <text x="977" y="449" text-anchor="middle" class="tiny" fill="#0f766e">CTA 0</text>
  <path d="M1025 436 H1060" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1060" y="282" width="445" height="315" rx="15" fill="#ffffff" stroke="#2dd4bf"/>
  <text x="1085" y="311" class="label" fill="#0f766e">CTA 0 · logical rows 0–7</text>
  <text x="1085" y="332" class="tiny">16 active threads per row; adjacent pairs fill one 32-lane physical warp</text>
  <g class="tiny" text-anchor="end"><text x="1128" y="361">row 0</text><text x="1128" y="393">row 1</text><text x="1128" y="425">row 2</text><text x="1128" y="457">row 3</text><text x="1128" y="489">row 4</text><text x="1128" y="521">row 5</text><text x="1128" y="553">row 6</text><text x="1128" y="585">row 7</text></g>
  <use href="#row16" x="1140" y="340" width="256" height="24"/><use href="#row16" x="1140" y="372" width="256" height="24"/>
  <use href="#row16" x="1140" y="404" width="256" height="24"/><use href="#row16" x="1140" y="436" width="256" height="24"/>
  <use href="#row16" x="1140" y="468" width="256" height="24"/><use href="#row16" x="1140" y="500" width="256" height="24"/>
  <use href="#row16" x="1140" y="532" width="256" height="24"/><use href="#row16" x="1140" y="564" width="256" height="24"/>
  <g fill="none" stroke="#0f766e" stroke-width="1.5">
    <path d="M1410 340 H1425 V396 H1410"/><path d="M1410 404 H1425 V460 H1410"/><path d="M1410 468 H1425 V524 H1410"/><path d="M1410 532 H1425 V588 H1410"/>
  </g>
  <g class="tiny" fill="#0f766e"><text x="1435" y="372">warp 0</text><text x="1435" y="436">warp 1</text><text x="1435" y="500">warp 2</text><text x="1435" y="564">warp 3</text></g>

  <!-- bottom summary panels -->
  <rect x="60" y="625" width="470" height="205" rx="18" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="90" y="663" class="section">What changes</text>
  <text x="90" y="701" class="formula">CTA count: rows → ceil(rows / 8)</text>
  <text x="90" y="740" class="mono">T_before ≈ T_launch + rows · t_CTA + T_work</text>
  <text x="90" y="773" class="mono">T_after  ≈ T_launch + ceil(rows/8) · t_CTA</text>
  <text x="185" y="801" class="mono">+ T_work + T_pack</text>

  <rect x="550" y="625" width="400" height="205" rx="18" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="580" y="663" class="section">Why it works</text>
  <g>
    <circle cx="590" cy="701" r="4" fill="#0f766e"/><text x="607" y="706" class="label">Tiny D does little useful work per CTA</text>
    <circle cx="590" cy="735" r="4" fill="#0f766e"/><text x="607" y="740" class="label">Fewer, fuller CTAs amortize dispatch</text>
    <circle cx="590" cy="769" r="4" fill="#0f766e"/><text x="607" y="774" class="label">Rows remain independent subgroups</text>
    <circle cx="590" cy="803" r="4" fill="#0f766e"/><text x="607" y="808" class="label">Multi-warp rows are not packed</text>
  </g>

  <rect x="970" y="625" width="570" height="205" rx="18" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="1000" y="663" class="section" fill="#1d4ed8">Measured speedup · BF16</text>
  <text x="1000" y="691" class="small">524,288 rows · H200 / B200</text>
  <g class="small" text-anchor="middle"><text x="1042" y="724">D</text><text x="1135" y="724">rows / CTA</text><text x="1250" y="724">H200</text><text x="1370" y="724">B200</text></g>
  <g stroke="#dbeafe"><line x1="1000" y1="736" x2="1510" y2="736"/><line x1="1000" y1="766" x2="1510" y2="766"/><line x1="1000" y1="796" x2="1510" y2="796"/></g>
  <g class="small" text-anchor="middle">
    <text x="1042" y="758">64</text><text x="1135" y="758">16</text><text x="1250" y="758">9.08×</text><text x="1370" y="758">8.90×</text>
    <text x="1042" y="788">128</text><text x="1135" y="788">8</text><text x="1250" y="788">4.79×</text><text x="1370" y="788">5.41×</text>
    <text x="1042" y="818">256 / 512</text><text x="1135" y="818">4</text><text x="1250" y="818">2.31× / 1.26×</text><text x="1410" y="818">2.60× / 1.49×</text>
  </g>
  <text x="1485" y="691" text-anchor="end" class="small" fill="#1d4ed8">D=128 plateau: 4.94× / 5.70×</text>

  <rect x="60" y="850" width="1480" height="34" rx="10" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="800" y="872" text-anchor="middle" class="label" fill="#0f766e">The speedup comes from fewer GPU block dispatches—not fewer host launches, FLOPs, or bytes.</text>
  <text x="60" y="893" class="tiny">Audited specialization: D=128 BF16 · 16 threads/row · 8 rows/CTA · source and measurements documented in FAST_HADAMARD_TRANSFORM_GPU_OPTIMIZATION.md §§4–6</text>
</svg>
