ce' font-size="16" font-weight="720" fill="#7c3aed" text-anchor="start">autograd</text><rect x="1623.2" y="629" width="92.8" height="32" rx="16" fill="#7c3aed" stroke="none" stroke-width="1"/><text x="1669.6000000000001" y="651" font-family='&quot;SFMono-Regular&quot;, Consolas, monospace' font-size="13" font-weight="650" fill="#ffffff" text-anchor="middle">safety rule</text><text x="1196" y="673" font-family='&quot;SFMono-Regular&quot;, Consolas, monospace' font-size="12" font-weight="650" fill="#334155" text-anchor="start">shape: do not save</text><text x="1196" y="694" font-family='&quot;SFMono-Regular&quot;, Consolas, monospace' font-size="12" font-weight="650" fill="#475569" text-anchor="start">layout / stride: N/A</text><text x="1196" y="716" font-family='Inter, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, -apple-system, sans-serif' font-size="14" font-weight="400" fill="#334155"><tspan x="1196" dy="0">禁止让该 alias 进入 autograd-saved state；训练需要稳定值时使用</tspan><tspan x="1196" dy="20">zero_copy=False。</tspan></text>
