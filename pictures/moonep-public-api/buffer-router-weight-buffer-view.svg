xt x="1455.0" y="404" font-family='Inter, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, -apple-system, sans-serif' font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">padding zeros</text><rect x="1543.3333333333333" y="385" width="170.66666666666666" height="28" rx="6" fill="#8b5cf6" stroke="none" stroke-width="1"/><text x="1628.6666666666665" y="404" font-family='Inter, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, -apple-system, sans-serif' font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">undefined tail</text><rect x="1178" y="433" width="554" height="178" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="1"/><text x="1196" y="460" font-family='&quot;SFMono-Regular&quot;, Consolas, monospace' font-size="16" font-weight="720" fill="#7c3aed" text-anchor="start">write semantics</text><rect x="1626" y="441" width="90" height="32" rx="16" fill="#7c3aed" stroke="none" stroke-width="1"/><text x="1671.0" y="463" font-family='&quot;SFMono-Regular&quot;, Consolas, monospace' font-size="13" font-weight="650" fill="#ffffff" text-anchor="middle">fp32</text><text x="1196" y="485" font-family='&quot;SFMono-Regular&quot;, Consolas, monospace' font-size="12" font-weight="650" fill="#334155" text-anchor="start">shape: 4 bytes / row</text><text x="1196" y="506" font-family='&quot;SFMono-Regular&quot;, Consolas, monospace' font-size="12" font-weight="650" fill="#475569" text-anchor="start">layout / stride: offset(loff)=loff</text><text x="1196" y="528" font-family='Inter, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, -apple-system, sans-serif' font-size="14" font-weight="400" fill="#334155"><tspan x="1196" dy="0">padding slot 写 int32 0，与 fp32 0.0 的全零 bit pattern 相同。</tspan></text><rect x="1178" y="621" width="554" height="178" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="1"/><text x="1196" y="648" font-family='&quot;SFMono-Regular&quot;, Consolas, monospace' font-size="16" font-weight="720" fill="#7c3aed" text-