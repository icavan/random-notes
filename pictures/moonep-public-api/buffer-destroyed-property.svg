<rect x="80" y="1405" width="18" height="18" rx="5" fill="#2dd4bf" stroke="none" stroke-width="1"/>
<text x="112" y="1420" font-family='Inter, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, -apple-system, sans-serif' font-size="15" font-weight="400" fill="#cbd5e1"><tspan x="112" dy="0">destroy() 幂等，因此可先检查但通常无需条件分支。</tspan></text>
