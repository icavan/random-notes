f" text-anchor="middle">host</text><text x="86" y="485" font-family='&quot;SFMono-Regular&quot;, Consolas, monospace' font-size="12" font-weight="650" fill="#334155" text-anchor="start">shape: Python bool</text><text x="86" y="506" font-family='&quot;SFMono-Regular&quot;, Consolas, monospace' font-size="12" font-weight="650" fill="#475569" text-anchor="start">layout / stride: after destroy</text><text x="86" y="528" font-family='Inter, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, -apple-system, sans-serif' font-size="14" font-weight="400" fill="#334155"><tspan x="86" dy="0">_ctx=None 且 _comm_stream=None。</tspan></text>
<rect x="755" y="185" width="380" height="1050" rx="20" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="779" y="225" font-family='Inter, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, -apple-system, sans-serif' font-size="21" font-weight="730" fill="#334155" text-anchor="start">Execution / ownership flow</text><rect x="777" y="250" width="336" height="112" rx="13" fill="#ffffff" stroke="#7c3aed" stroke-width="1.3"/><rect x="777" y="250" width="42" height="112" rx="13" fill="#7c3aed" stroke="none" stroke-width="1"/><text x="798" y="313.0" font-family='Inter, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, -apple-system, sans-serif' font-size="18" font-weight="750" fill="#ffffff" text-anchor="middle">1</text><text x="833" y="278" font-family='Inter, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, -apple-system, sans-serif' font-size="16" font-weight="700" fill="#7c3aed" text-anchor="start">@property access</text><text x="833" y="303" font-family='Inter, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, -apple-system, sans-serif' font-size="13" font-weight="400" fill="#475569"><tspan x="833" dy="0">直接读取 self._destroyed。</tspan></text><path d="M945.0 362 V373" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="777" y="376" width="336" height="112" rx="13" fill="#ffffff" stroke="#2563eb" stroke-width="1.3"/><rect x="777" y="376" width="42" height="112" rx="13" fill="#2563eb" stroke="none" stroke-width="1"/><text x="798" y="439.0" font-family='Inter, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, -apple-system, sans-serif' font-size="18" font-weight="750" fill="#ffffff" text-anchor="middle">2</text><text x="833" y="404" font-family='Inter, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, -apple-system, sans-serif' font-size="16" font-weight="700" fill="#2563eb" text-anchor="start">No synchronization</text><text x="833" y="429" font-family='Inter, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, -apple-system, sans-serif' font-size="13" font-weight="400" fill="#475569"><tspan x="833" dy="0">不查询 CUDA event / stream。</tspan></text><path d="M945.0 488 V499" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="777" y="502" width="336" height="112" rx="13" fill="#ffffff" stroke="#0f766e" stroke-width="1.3"/><rect x="777" y="502" width="42" height="112" rx="13" fill="#0f766e" stroke="none" stroke-width="1"/><text x="798" y="565.0" font-family='Inter, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, -apple-system, sans-serif' font-size="18" font-weight="750" fill="#ffffff" text-anchor="middle">3</text><text x="833" y="530" font-family='Inter, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, -apple-system, sans-serif' font-size="16" font-weight="700" fill="#0f766e" text-anchor="start">No GMEM access</text><text x="833" y="555" font-family='Inter, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, -apple-system, sans-serif' font-size="13" font-weight="400" fill="#475569"><tspan x="833" dy="0">不解引用任何 tensor 或 VMM pointer。</tspan></text><path d="M945.0 614 V625" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="777" y="628" width="336" height="112" rx="13" fill="#ffffff" stroke="#ea580c" stroke-width="1.3"/><rect x="777" y="628" width="42" height="112" rx="13" fill="#ea580c" stroke="none" stroke-width="1"/><text x="798" y="691.0" font-family='Inter, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, -apple-system, sans-serif' font-size="18" font-weight="750" fill="#ffffff" text-anchor="middle">4</text><text x="833" y="656" font-family='Inter, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, -apple-system, sans-serif' font-size="16" font-weight="700" fill="#ea580c" text-anchor="start">Return bool</text><text x="833" y="681" font-family='Inter, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, -apple-system, sans-serif' font-size="13" font-weight="400" fill="#475569"><tspan x="833" dy="0">只是 host-side 生命周期观察值。</tspan></text>
<rect x="1160" y="185" width="590" height="1050" rx="20" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/><text x="1184" y="225" font-family='Inter, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, -apple-system, sans-serif' font-size="23" font-weight="730" fill="#7c3aed" text-anchor="start">Meaning for callers</text><rect x="1178" y="245" width="554" height="178" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="1"/><text x="1196" y="272" font-family='&quot;SFMono-Regular&quot;, Consolas, monospace' font-size="16" font-weight="720" fill="#7c3aed" text-anchor="start">False</text><rect x="1626" y="253" width="90" height="32" rx="16" fill="#7c3aed" stroke="none" stroke-width="1"/><text x="1671.0" y="275" font-family='&quot;SFMono-Regular&quot;, Consolas, monospace' font-size="13" font-weight="650" fill="#ffffff" text-anchor="middle">bool</text><text x="1196" y="297" font-family='&quot;SFMono-Regular&quot;, Consolas, monospace' font-size="12" font-weight="650" fill="#334155" text-anchor="start">shape: Buffer live</text><text x="1196" y="318" font-family='&quot;SFMono-Regular&quot;, Consolas, monospace' font-size="12" font-weight="650" fill="#475569" text-anchor="start">layout / stride: host</text><text x="1196" y="340" font-family='Inter, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, -apple-system, sans-serif' font-size="14" font-weight="400" fill="#334155"><tspan x="1196" dy="0">不保证某次 async operation 已完成；只说明资源 owner 尚未 destroy。</tspan></text><rect x="1178" y="433" width="554" height="178" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="1"/><text x="1196" y="460" font-family='&quot;SFMono-Regular&quot;, Consolas, monospace' font-size="16" font-weight="720" fill="#7c3aed" text-anchor="start">True</text><rect x="1626" y="441" width="90" height="32" rx="16" fill="#7c3aed" stroke="none" stroke-width="1"/><text x="1671.0" y="463" font-family='&quot;SFMono-Regular&quot;, Consolas, monospace' font-size="13" font-weight="650" fill="#ffffff" text-anchor="middle">bool</text><text x="1196" y="485" font-family='&quot;SFMono-Regular&quot;, Consolas, monospace' font-size="12" font-weight="650" fill="#334155" text-anchor="start">shape: Buffer closed</text><text x="1196" y="506" font-family='&quot;SFMono-Regular&quot;, Consolas, monospace' font-size="12" font-weight="650" fill="#475569" text-anchor="start">layout / stride: host</text><text x="1196" y="528" font-family='Inter, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, -apple-system, sans-serif' font-size="14" font-weight="400" fill="#334155"><tspan x="1196" dy="0">再次调用 dispatch/prefetch/combine/reduce 或访问 views 会失败。</tspan></text><rect x="1178" y="621" width="554" height="178" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="1"/><text x="1196" y="648" font-family='&quot;SFMono-Regular&quot;, Consolas, monospace' font-size="16" font-weight="720" fill="#7c3aed" text-anchor="start">not a readiness flag</text><rect x="1626" y="629" width="90" height="32" rx="16" fill="#7c3aed" stroke="none" stroke-width="1"/><text x="1671.0" y="651" font-family='&quot;SFMono-Regular&quot;, Consolas, monospace' font-size="13" font-weight="650" fill="#ffffff" text-anchor="middle">important</text><text x="1196" y="673" font-family='&quot;SFMono-Regular&quot;, Consolas, monospace' font-size="12" font-weight="650" fill="#334155" text-anchor="start">shape: no CUDA semantics</text><text x="1196" y="694" font-family='&quot;SFMono-Regular&quot;, Consolas, monospace' font-size="12" font-weight="650" fill="#475569" text-anchor="start">layout / stride: N/A</text><text x="1196" y="716" font-family='Inter, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, -apple-system, sans-serif' font-size="14" font-weight="400" fill="#334155"><tspan x="1196" dy="0">异步完成状态应等待 API 返回的 CUDA event，而不是读取 destroyed。</tspan></text>
