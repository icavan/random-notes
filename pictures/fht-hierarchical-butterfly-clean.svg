<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Hierarchical butterfly network in the CuTe DSL Fast Hadamard Transform</title>
  <desc id="desc">A clean white source-audited diagram for BF16 D equals 4096 showing one global load, register H8 butterflies, warp-shuffle H32 butterflies, shared-memory reownership for H8 across warps, a local H2 chunk butterfly, and one global store.</desc>
  <metadata><![CDATA[
  {"id":"fht-hierarchical-butterfly-clean","scope":"public main baseline, BF16 D=4096 power-of-two specialization","source_refs":["cutedsl/hadamard_transform.py:63-87","cutedsl/hadamard_transform.py:285-475","cutedsl/hadamard_transform.py:688-742","cutedsl/hadamard_transform.py:925-952"],"config":{"D":4096,"dtype":"BF16","n_elts":8,"warp_size":32,"n_warps":8,"n_threads":256,"n_chunks":2,"rows_per_block":1,"smem_f32_elements":4096,"dynamic_smem_bytes":16384,"n_exchanges":1},"assertions":["one CTA processes one row","one LDG.128 and one STG.128 per chunk per thread","H8 item butterfly is thread-local","H32 lane butterfly uses SHFL.XOR offsets 1,2,4,8,16","cross-warp H8 uses two SMEM transpose passes and four CTA barriers","H2 chunk butterfly is thread-local and its source-level x_t copy need not imply SASS MOV instructions"]}
  ]]></metadata>
  <defs>
    <style>
      text { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-weight: 400; fill: #1e293b; }
      .title { font-size: 38px; fill: #0f172a; }
      .subtitle { font-size: 18px; fill: #64748b; }
      .section { font-size: 20px; fill: #0f172a; }
      .label { font-size: 15px; }
      .small { font-size: 12px; fill: #64748b; }
      .tiny { font-size: 10px; fill: #64748b; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; font-size: 12px; }
      .formula { font-family: "STIX Two Math", "Times New Roman", serif; font-size: 21px; }
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#64748b"/>
    </marker>
    <pattern id="smemGrid" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#ffedd5"/><path d="M12 0H0V12" fill="none" stroke="#fb923c" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="#ffffff"/>
  <text x="55" y="58" class="title">Hierarchical butterfly network in CuTe DSL FHT</text>
  <text x="55" y="91" class="subtitle">One CTA per row · one global read · one global write · cheapest available communication at each factor</text>

  <!-- factorization and cost -->
  <rect x="55" y="118" width="775" height="82" rx="15" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="80" y="149" class="label">Data ownership</text>
  <text x="210" y="149" class="mono" fill="#166534">x[chunk][warp][lane][item]</text>
  <text x="80" y="180" class="formula">D = C × N<tspan baseline-shift="sub" font-size="12">warps</tspan> × W × E</text>
  <text x="405" y="180" class="formula">H<tspan baseline-shift="sub" font-size="12">D</tspan> = H<tspan baseline-shift="sub" font-size="12">C</tspan> ⊗ H<tspan baseline-shift="sub" font-size="12">Nwarps</tspan> ⊗ H<tspan baseline-shift="sub" font-size="12">W</tspan> ⊗ H<tspan baseline-shift="sub" font-size="12">E</tspan></text>

  <rect x="850" y="118" width="695" height="82" rx="15" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="875" y="146" class="label">Relative communication cost</text>
  <rect x="1080" y="132" width="116" height="46" rx="10" fill="#f0fdf4" stroke="#86efac"/>
  <text x="1138" y="151" text-anchor="middle" class="tiny" fill="#166534">thread local</text><text x="1138" y="169" text-anchor="middle" class="small" fill="#166534">registers</text>
  <text x="1208" y="162" class="label">&lt;</text>
  <rect x="1232" y="132" width="116" height="46" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="1290" y="151" text-anchor="middle" class="tiny" fill="#1d4ed8">warp local</text><text x="1290" y="169" text-anchor="middle" class="small" fill="#1d4ed8">SHFL.XOR</text>
  <text x="1360" y="162" class="label">&lt;</text>
  <rect x="1384" y="132" width="136" height="46" rx="10" fill="#fff7ed" stroke="#fdba74"/>
  <text x="1452" y="151" text-anchor="middle" class="tiny" fill="#9a3412">CTA wide</text><text x="1452" y="169" text-anchor="middle" class="small" fill="#9a3412">SMEM + barriers</text>

  <!-- pipeline background -->
  <rect x="55" y="222" width="1490" height="466" rx="22" fill="#ffffff" stroke="#94a3b8"/>
  <text x="800" y="251" text-anchor="middle" class="small">ONE CTA · ONE D=4096 ROW · 256 THREADS</text>

  <!-- arrows behind cards -->
  <g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M185 450 H205"/><path d="M420 450 H440"/><path d="M665 450 H685"/><path d="M1095 450 H1115"/><path d="M1360 450 H1380"/>
  </g>

  <!-- GMEM input -->
  <rect x="75" y="285" width="110" height="330" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="130" y="317" text-anchor="middle" class="label">Global input</text>
  <rect x="102" y="345" width="56" height="175" rx="9" fill="#ffffff" stroke="#94a3b8"/>
  <g fill="#dbeafe"><rect x="114" y="360" width="32" height="22" rx="3"/><rect x="114" y="392" width="32" height="22" rx="3"/><rect x="114" y="424" width="32" height="22" rx="3"/><rect x="114" y="456" width="32" height="22" rx="3"/><rect x="114" y="488" width="32" height="18" rx="3"/></g>
  <text x="130" y="552" text-anchor="middle" class="label" fill="#1d4ed8">LDG.128</text>
  <text x="130" y="576" text-anchor="middle" class="tiny">2 loads/thread</text>
  <text x="130" y="595" text-anchor="middle" class="tiny">one per chunk</text>

  <!-- Stage 1 -->
  <rect x="205" y="275" width="215" height="350" rx="16" fill="#f0fdf4" stroke="#86efac"/>
  <text x="228" y="309" class="section" fill="#166534">1 · Thread registers</text>
  <text x="228" y="336" class="small">H₈ on the item axis</text>
  <text x="395" y="348" text-anchor="end" class="tiny" fill="#166534">strides 1 · 2 · 4</text>
  <rect x="228" y="362" width="72" height="188" rx="10" fill="#ffffff" stroke="#86efac"/>
  <g class="tiny" text-anchor="middle"><text x="264" y="386">r0</text><text x="264" y="408">r1</text><text x="264" y="430">r2</text><text x="264" y="452">r3</text><text x="264" y="474">r4</text><text x="264" y="496">r5</text><text x="264" y="518">r6</text><text x="264" y="540">r7</text></g>
  <g fill="#22c55e"><circle cx="330" cy="382" r="4"/><circle cx="330" cy="404" r="4"/><circle cx="330" cy="426" r="4"/><circle cx="330" cy="448" r="4"/><circle cx="330" cy="470" r="4"/><circle cx="330" cy="492" r="4"/><circle cx="330" cy="514" r="4"/><circle cx="330" cy="536" r="4"/></g>
  <g fill="none" stroke="#16a34a" stroke-width="1.6"><path d="M330 382 C382 382 382 404 330 404"/><path d="M330 426 C382 426 382 448 330 448"/><path d="M330 470 C382 470 382 492 330 492"/><path d="M330 514 C382 514 382 536 330 536"/></g>
  <text x="228" y="577" class="small" fill="#166534">No communication</text>
  <text x="228" y="599" class="small" fill="#166534">No synchronization</text>

  <!-- Stage 2 -->
  <rect x="440" y="275" width="225" height="350" rx="16" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="463" y="309" class="section" fill="#1d4ed8">2 · Warp shuffle</text>
  <text x="463" y="336" class="small">H₃₂ on the lane axis</text>
  <rect x="463" y="365" width="179" height="47" rx="9" fill="#ffffff" stroke="#93c5fd"/>
  <g fill="#60a5fa">
    <circle cx="478" cy="388" r="4"/><circle cx="492" cy="388" r="4"/><circle cx="506" cy="388" r="4"/><circle cx="520" cy="388" r="4"/><circle cx="534" cy="388" r="4"/><circle cx="548" cy="388" r="4"/><circle cx="562" cy="388" r="4"/><circle cx="576" cy="388" r="4"/><circle cx="590" cy="388" r="4"/><circle cx="604" cy="388" r="4"/><circle cx="618" cy="388" r="4"/><circle cx="632" cy="388" r="4"/>
  </g>
  <text x="552" y="436" text-anchor="middle" class="mono">SHFL.XOR</text>
  <text x="552" y="463" text-anchor="middle" class="small">offsets 1 · 2 · 4 · 8 · 16</text>
  <g stroke="#2563eb" fill="none" stroke-width="1.5"><path d="M478 495 C492 479 492 479 506 495"/><path d="M520 495 C534 479 534 479 548 495"/><path d="M562 495 C576 479 576 479 590 495"/><path d="M604 495 C618 479 618 479 632 495"/><path d="M478 528 C506 504 506 504 534 528"/><path d="M548 528 C576 504 576 504 604 528"/></g>
  <text x="463" y="577" class="small" fill="#1d4ed8">Register-to-register exchange</text>
  <text x="463" y="599" class="small" fill="#1d4ed8">No CTA barrier</text>

  <!-- Stage 3 -->
  <rect x="685" y="265" width="410" height="370" rx="16" fill="#fff7ed" stroke="#fdba74"/>
  <text x="708" y="299" class="section" fill="#9a3412">3 · Cross-warp exchange</text>
  <text x="708" y="326" class="small">H₈ on the warp axis · shuffle remains warp-local</text>

  <rect x="708" y="355" width="58" height="132" rx="8" fill="#ffffff" stroke="#fdba74"/>
  <text x="737" y="375" text-anchor="middle" class="tiny">registers</text>
  <g class="tiny" text-anchor="middle"><text x="737" y="400">warp 0</text><text x="737" y="420">warp 1</text><text x="737" y="440">···</text><text x="737" y="460">warp 7</text></g>

  <path d="M766 421 H786" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="790" y="350" width="66" height="142" rx="8" fill="url(#smemGrid)" stroke="#f97316"/>
  <text x="823" y="515" text-anchor="middle" class="tiny" fill="#9a3412">Pass A</text>

  <path d="M856 421 H876" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="880" y="355" width="70" height="132" rx="8" fill="#ffffff" stroke="#fdba74"/>
  <text x="915" y="376" text-anchor="middle" class="tiny">transposed</text>
  <g fill="#fed7aa"><rect x="894" y="392" width="8" height="72"/><rect x="906" y="392" width="8" height="72"/><rect x="918" y="392" width="8" height="72"/><rect x="930" y="392" width="8" height="72"/></g>
  <text x="915" y="515" text-anchor="middle" class="tiny">new ownership</text>

  <path d="M950 421 H970" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="974" y="371" width="68" height="100" rx="8" fill="#ffffff" stroke="#fdba74"/>
  <text x="1008" y="397" text-anchor="middle" class="tiny">SHFL.XOR</text>
  <text x="1008" y="421" text-anchor="middle" class="label" fill="#9a3412">H₈</text>
  <text x="1008" y="447" text-anchor="middle" class="tiny">1 · 2 · 4</text>

  <path d="M1042 421 H1058" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="1062" y="350" width="22" height="142" rx="6" fill="url(#smemGrid)" stroke="#f97316"/>
  <text x="1073" y="515" text-anchor="middle" class="tiny" fill="#9a3412">B</text>

  <rect x="708" y="545" width="364" height="64" rx="10" fill="#ffffff" stroke="#fed7aa"/>
  <text x="890" y="570" text-anchor="middle" class="small" fill="#9a3412">Pass A changes ownership · H₈ runs with SHFL · Pass B restores ownership</text>
  <text x="890" y="593" text-anchor="middle" class="tiny">one exchange round · four CTA barriers · XOR-swizzled SMEM · 16 KiB dynamic SMEM</text>

  <!-- Stage 4 -->
  <rect x="1115" y="275" width="245" height="350" rx="16" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="1138" y="309" class="section" fill="#6d28d9">4 · Chunk butterfly</text>
  <text x="1138" y="336" class="small">H₂ on the chunk axis</text>
  <rect x="1138" y="366" width="82" height="106" rx="9" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="1179" y="389" text-anchor="middle" class="tiny">x_reg[c,i]</text>
  <rect x="1152" y="408" width="24" height="46" fill="#ede9fe" stroke="#8b5cf6"/><rect x="1182" y="408" width="24" height="46" fill="#ede9fe" stroke="#8b5cf6"/>
  <path d="M1220 420 H1240" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="1244" y="366" width="90" height="106" rx="9" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="1289" y="389" text-anchor="middle" class="tiny">x_t[i,c]</text>
  <text x="1289" y="425" text-anchor="middle" class="formula" fill="#6d28d9">H₂</text>
  <text x="1289" y="452" text-anchor="middle" class="tiny">a+b · a−b</text>
  <text x="1138" y="505" class="small" fill="#6d28d9">Thread-local register values</text>
  <text x="1138" y="528" class="small" fill="#6d28d9">No inter-thread communication</text>
  <line x1="1138" y1="552" x2="1337" y2="552" stroke="#ddd6fe"/>
  <text x="1138" y="578" class="tiny">The transpose is a source-level logical view.</text>
  <text x="1138" y="597" class="tiny">SASS audit found no corresponding MOVs.</text>

  <!-- GMEM output -->
  <rect x="1380" y="285" width="140" height="330" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="1450" y="317" text-anchor="middle" class="label">Global output</text>
  <rect x="1422" y="345" width="56" height="175" rx="9" fill="#ffffff" stroke="#94a3b8"/>
  <g fill="#ccfbf1"><rect x="1434" y="360" width="32" height="22" rx="3"/><rect x="1434" y="392" width="32" height="22" rx="3"/><rect x="1434" y="424" width="32" height="22" rx="3"/><rect x="1434" y="456" width="32" height="22" rx="3"/><rect x="1434" y="488" width="32" height="18" rx="3"/></g>
  <text x="1450" y="548" text-anchor="middle" class="tiny">scale + downcast</text>
  <text x="1450" y="573" text-anchor="middle" class="label" fill="#0f766e">STG.128</text>
  <text x="1450" y="596" text-anchor="middle" class="tiny">2 stores/thread</text>

  <!-- specialization strip -->
  <rect x="55" y="712" width="1490" height="92" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="80" y="746" class="section">BF16 · D=4096 specialization</text>
  <rect x="350" y="730" width="125" height="52" rx="10" fill="#f0fdf4" stroke="#86efac"/><text x="412" y="750" text-anchor="middle" class="tiny">item axis</text><text x="412" y="771" text-anchor="middle" class="label" fill="#166534">E = 8</text>
  <rect x="490" y="730" width="125" height="52" rx="10" fill="#eff6ff" stroke="#93c5fd"/><text x="552" y="750" text-anchor="middle" class="tiny">lane axis</text><text x="552" y="771" text-anchor="middle" class="label" fill="#1d4ed8">W = 32</text>
  <rect x="630" y="730" width="125" height="52" rx="10" fill="#fff7ed" stroke="#fdba74"/><text x="692" y="750" text-anchor="middle" class="tiny">warp axis</text><text x="692" y="771" text-anchor="middle" class="label" fill="#9a3412">N = 8</text>
  <rect x="770" y="730" width="125" height="52" rx="10" fill="#f5f3ff" stroke="#c4b5fd"/><text x="832" y="750" text-anchor="middle" class="tiny">chunk axis</text><text x="832" y="771" text-anchor="middle" class="label" fill="#6d28d9">C = 2</text>
  <text x="930" y="751" class="small">256 threads × 8 items × 2 chunks = 4096 values</text>
  <text x="930" y="776" class="formula">H₄₀₉₆ = H₂<tspan font-size="12"> chunks</tspan> ⊗ H₈<tspan font-size="12"> warps</tspan> ⊗ H₃₂<tspan font-size="12"> lanes</tspan> ⊗ H₈<tspan font-size="12"> items</tspan></text>

  <rect x="55" y="824" width="1490" height="50" rx="13" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="80" y="855" class="label" fill="#1d4ed8">Key idea</text>
  <text x="180" y="855" class="label">Factor one dense transform across item, lane, warp, and chunk ownership—then use the cheapest communication available for each factor.</text>
  <text x="55" y="895" class="tiny">Source audit: public main baseline · cutedsl/hadamard_transform.py lines 285–475 and 688–742 · scanner supplemented by manual inspection of four cute.arch.barrier() calls</text>
</svg>
