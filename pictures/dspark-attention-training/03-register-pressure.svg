<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1440" viewBox="0 0 1800 1440" role="img" aria-labelledby="title desc">
<title id="title">Packed THD: why a generic mask raises register pressure</title>
<desc id="desc">White-background comparison. The tested FA4 callback reconstructs logical coordinates and combines eight metadata inputs while scores are live. cuDNN precomputes consumer-aligned predicates and loads compact words. Conceptual register bars show how extra live state can spill. NCU measurements are shown separately; THD itself is not the cause.</desc>
<metadata>Original explanatory artwork. Copyright 2026 Ant Group Co., Ltd. SPDX-License-Identifier: Apache-2.0. NCU evidence: aspec-five-attn-20261105-61550139. Register-capacity bars are schematic, not measured allocation counts.</metadata>
